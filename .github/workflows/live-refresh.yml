name: Refresh live Destiny data

on:
  schedule:
    # Every 30 minutes. The cache TTL is 15-30 minutes, so this keeps it warm.
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: live-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Refresh live cache
        run: pnpm live:refresh
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BUNGIE_API_KEY: ${{ secrets.BUNGIE_API_KEY }}
